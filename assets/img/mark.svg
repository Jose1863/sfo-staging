<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Stakeholder's Family Office">
  <title>Stakeholder's Family Office</title>
  <desc>A four-pillar temple front under a low pediment: one firm, four pillars. Brand gold on transparent, tuned for the deep-green ground.</desc>
  <defs>
    <linearGradient id="sfoGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D4A6"/>
      <stop offset="0.5" stop-color="#B8963E"/>
      <stop offset="1" stop-color="#8E7330"/>
    </linearGradient>
  </defs>
  <g fill="url(#sfoGold)">
    <!-- pediment -->
    <path d="M50 13 L83 27 H17 Z"/>
    <!-- entablature -->
    <rect x="17" y="30" width="66" height="6" rx="1"/>
    <!-- four columns -->
    <rect x="23" y="39" width="7.5" height="38"/>
    <rect x="38.5" y="39" width="7.5" height="38"/>
    <rect x="54" y="39" width="7.5" height="38"/>
    <rect x="69.5" y="39" width="7.5" height="38"/>
    <!-- stylobate -->
    <rect x="15" y="80" width="70" height="6" rx="1"/>
  </g>
  <!-- champagne highlight seam on the entablature -->
  <rect x="17" y="30" width="66" height="1.4" rx="0.7" fill="#F2E6CC" opacity="0.7"/>
</svg>
