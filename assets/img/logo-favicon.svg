<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t d">
  <title id="t">SFO Mark — v2 · Minimal Pillars (favicon)</title>
  <desc id="d">Variant 2: four bold, abstracted columns under a single architrave and stylobate, with a stronger, more present serif S in front. Detail is stripped so the mark stays crisp and legible at 32px favicon size.</desc>

  <!-- champagne #F2E2C2 · gold #E8C266 · bullion #A37F38 · deep-gold #7d5f2a · lacquer #141210 -->
  <defs>
    <linearGradient id="v2-s" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#F2E2C2"/><stop offset="0.5" stop-color="#E8C266"/><stop offset="1" stop-color="#A37F38"/>
    </linearGradient>
    <linearGradient id="v2-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A24E"/><stop offset="1" stop-color="#7d5f2a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="11" fill="#141210"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="9.5" fill="none" stroke="#E8C266" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- Four bold abstract columns: solid bullion bars, no fluting, heavy entablature + stylobate -->
  <g fill="#A8843A">
    <rect x="26" y="44" width="9" height="32"/>
    <rect x="44" y="44" width="9" height="32"/>
    <rect x="67" y="44" width="9" height="32"/>
    <rect x="85" y="44" width="9" height="32"/>
  </g>
  <!-- Architrave (top) -->
  <rect x="21" y="36" width="78" height="6" rx="1.2" fill="url(#v2-band)"/>
  <!-- Stylobate (bottom) -->
  <rect x="20" y="78" width="80" height="6" rx="1.2" fill="url(#v2-band)"/>
  <rect x="17" y="84.5" width="86" height="3.5" rx="1.4" fill="#7d5f2a"/>

  <!-- Stronger, heavier S — thicker stems so it survives downscaling, still high-contrast serif -->
  <path fill="url(#v2-s)" transform="translate(5 0)" d="
    M 79 40
    C 76.5 28.5, 67 21, 53 21
    C 36.5 21, 25.5 29, 25.5 42
    C 25.5 52.5, 32.5 58, 49 62.5
    C 62 66, 66 68.5, 66 74
    C 66 80.5, 59 85, 48.5 85
    C 37.5 85, 30 79.5, 27 68.5
    L 19 72.5
    C 22.5 85, 34 92, 50 92
    C 68.5 92, 80.5 83, 80.5 69
    C 80.5 58.5, 73 53, 55.5 48.5
    C 41 45, 36.5 42, 36.5 36.5
    C 36.5 29.5, 43 25, 53.5 25
    C 64 25, 70.5 29.5, 72.5 39
    Z"/>
  <path transform="translate(5 0)" d="M 38 25 C 45 20, 53 18.2, 61.5 18.2" fill="none"
        stroke="#F2E2C2" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
</svg>
